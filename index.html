<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida 💛</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Caveat', cursive, serif;
            overflow: hidden;
            color: #ffe135;
        }

        /* Pantalla de inicio "Toca para iniciar" idéntica */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 1.2s ease;
        }

        .center-flower {
            font-size: 5rem;
            animation: pulseFlower 1.5s infinite alternate;
            text-shadow: 0 0 25px #ffe135;
        }

        #welcome-screen h2 {
            font-size: 2.2rem;
            margin-top: 15px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 225, 53, 0.6);
        }

        /* Contenedor de la Galaxia */
        #galaxy-container {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sun-center {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #332b00 0%, #000 75%);
            border-radius: 50%;
            box-shadow: 0 0 70px #ffe135, inset 0 0 40px #ffea75;
            z-index: 10;
        }

        .top-title {
            position: absolute;
            top: 6%;
            width: 100%;
            text-align: center;
            font-size: 2.8rem;
            text-shadow: 0 0 15px #ffe135;
            z-index: 20;
            letter-spacing: 1px;
        }

        /* Órbita de frases y rosas */
        .orbit {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            animation: rotateGalaxy 30s linear infinite;
        }

        .item-floating {
            position: absolute;
            white-space: nowrap;
            font-size: 1.6rem;
            text-shadow: 0 0 10px rgba(255, 225, 53, 0.9);
        }

        @keyframes pulseFlower {
            0% { transform: scale(1); }
            100% { transform: scale(1.18); }
        }

        @keyframes rotateGalaxy {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="welcome-screen" onclick="initExperience()">
        <div class="center-flower">💛</div>
        <h2>Toca para iniciar</h2>
    </div>

    <div id="galaxy-container">
        <div class="top-title">Feliz Día de las Rosas Amarillas 💛</div>
        <div class="sun-center"></div>

        <div class="orbit">
            <div class="item-floating" style="top: -10px; left: 50%;">💛 Eres mi sol</div>
            <div class="item-floating" style="bottom: -10px; left: 40%;">🌹 Te amo muchísimo</div>
            <div class="item-floating" style="top: 25%; left: -30px;">✨ Mi gran amor</div>
            <div class="item-floating" style="top: 70%; right: -40px;">🌻 Para ti, mi vida</div>
            <div class="item-floating" style="top: 10%; right: 0;">💛 Siempre juntos</div>
        </div>
    </div>

    <audio id="background-music" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-tenderness.mp3" type="audio/mpeg">
    </audio>

    <script>
        function initExperience() {
            var welcome = document.getElementById('welcome-screen');
            var galaxy = document.getElementById('galaxy-container');
            var music = document.getElementById('background-music');

            music.play().catch(e => console.log("Audio bloqueado por navegador"));

            welcome.style.opacity = '0';
            setTimeout(function() {
                welcome.style.display = 'none';
                galaxy.style.opacity = '1';
            }, 1000);
        }
    </script>
</body>
</html>

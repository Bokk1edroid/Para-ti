<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida 💛</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030303;
            font-family: 'Georgia', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Pantalla de inicio */
        #welcome-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        .flower-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        #welcome-screen h2 {
            font-size: 1.8rem;
            color: #ffe135;
            font-weight: normal;
            letter-spacing: 1px;
        }

        /* Contenido principal */
        #main-content {
            opacity: 0;
            transition: opacity 2s ease;
            text-align: center;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .galaxy-title {
            font-size: 1.6rem;
            color: #ffe135;
            text-shadow: 0 0 15px rgba(255, 225, 53, 0.8);
            margin-top: 20px;
            z-index: 10;
        }

        /* Contenedor de la órbita y el centro */
        .orbit-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto 0;
        }

        .planet-center {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #443a00, #000);
            border-radius: 50%;
            box-shadow: 0 0 40px #ffe135;
            z-index: 2;
        }

        /* Órbitas circulares animadas con rosas amarillas */
        .orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: spin 12s linear infinite;
        }

        .orbit-2 {
            position: absolute;
            width: 160%;
            height: 160%;
            animation: spinReverse 18s linear infinite;
        }

        .rose {
            position: absolute;
            font-size: 1.6rem;
            text-shadow: 0 0 10px rgba(255, 225, 53, 0.9);
        }

        /* Posiciones en la órbita 1 */
        .r1 { top: 0; left: 50%; transform: translateX(-50%); }
        .r2 { bottom: 0; left: 50%; transform: translateX(-50%); }
        .r3 { left: 0; top: 50%; transform: translateY(-50%); }
        .r4 { right: 0; top: 50%; transform: translateY(-50%); }

        /* Posiciones en la órbita 2 */
        .r5 { top: 10%; left: 10%; }
        .r6 { bottom: 10%; right: 10%; }
        .r7 { top: 10%; right: 10%; }
        .r8 { bottom: 10%; left: 10%; }

        .message-box {
            font-size: 1.05rem;
            color: #fff3a1;
            max-width: 90%;
            line-height: 1.6;
            text-shadow: 0 0 8px rgba(0,0,0,0.9);
            margin-bottom: 20px;
            z-index: 10;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    <div id="welcome-screen" onclick="startExperience()">
        <div class="flower-icon">💛</div>
        <h2>Toca para iniciar</h2>
    </div>

    <div id="main-content">
        <div class="galaxy-title">💛 Feliz Día de las Rosas Amarillas 💛</div>
        
        <div class="orbit-container">
            <div class="planet-center"></div>
            
            <div class="orbit">
                <div class="rose r1">💛</div>
                <div class="rose r2">💛</div>
                <div class="rose r3">💛</div>
                <div class="rose r4">💛</div>
            </div>

            <div class="orbit-2">
                <div class="rose r5">💛</div>
                <div class="rose r6">💛</div>
                <div class="rose r7">💛</div>
                <div class="rose r8">💛</div>
            </div>
        </div>

        <div class="message-box">
            Cada rosa amarilla que ves aquí es un latido de mi corazón.<br>
            Así como el sol ilumina los campos, tú iluminas mi vida.<br>
            <strong>¡Te amo muchísimo!</strong>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-tenderness.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startExperience() {
            var welcome = document.getElementById('welcome-screen');
            var mainContent = document.getElementById('main-content');
            var music = document.getElementById('bg-music');

            // Reproduce la música al hacer clic
            music.play().catch(error => {
                console.log("Audio bloqueado:", error);
            });

            // Transición de pantalla
            welcome.style.opacity = 0;
            setTimeout(function() {
                welcome.style.display = 'none';
                mainContent.style.opacity = 1;
            }, 1000);
        }
    </script>
</body>
</html>

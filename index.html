<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de las Flores Amarillas 🌻</title>
    <!-- Three.js para la galaxia 3D y GSAP para animaciones -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        /* --- PANTALLA INICIAL (Girasol & Música) --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #2a2200 0%, #0d0b00 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1.5s ease;
        }

        .sunflower-container {
            cursor: pointer;
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        .sunflower {
            width: 130px;
            height: 130px;
            position: relative;
            margin: 0 auto 20px auto;
        }

        .petals {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotatePetals 15s linear infinite;
        }

        .petal {
            position: absolute;
            width: 45px;
            height: 65px;
            background: linear-gradient(to top, #ffb703, #ffea6c);
            border-radius: 50% 50% 20% 20%;
            top: 32px;
            left: 42px;
            transform-origin: center bottom;
        }

        .petal:nth-child(1) { transform: rotate(0deg) translateY(-28px); }
        .petal:nth-child(2) { transform: rotate(45deg) translateY(-28px); }
        .petal:nth-child(3) { transform: rotate(90deg) translateY(-28px); }
        .petal:nth-child(4) { transform: rotate(135deg) translateY(-28px); }
        .petal:nth-child(5) { transform: rotate(180deg) translateY(-28px); }
        .petal:nth-child(6) { transform: rotate(225deg) translateY(-28px); }
        .petal:nth-child(7) { transform: rotate(270deg) translateY(-28px); }
        .petal:nth-child(8) { transform: rotate(315deg) translateY(-28px); }

        .center-disc {
            position: absolute;
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #4a220c 0%, #210d04 100%);
            border-radius: 50%;
            top: 37px;
            left: 37px;
            z-index: 2;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.6);
        }

        @keyframes rotatePetals {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .instruction-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 183, 3, 0.3);
            padding: 15px 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .instruction-card h2 {
            font-size: 1.3rem;
            color: #ffb703;
            margin-bottom: 5px;
        }

        .instruction-card p {
            font-size: 0.9rem;
            color: #ddd;
        }

        /* --- INTERFAZ PRINCIPAL (Estilo DedicaCodes) --- */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            transition: opacity 2s ease;
        }

        /* Título Principal Fijo (Arriba de la galaxia, tal cual el panel) */
        #top-title-banner {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 183, 3, 0.3);
            padding: 10px 25px;
            border-radius: 14px;
            backdrop-filter: blur(8px);
            z-index: 10;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 183, 3, 0.15);
            display: none;
            max-width: 90%;
        }

        #top-title-banner h1 {
            font-size: 1.15rem;
            color: #ffea6c;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 234, 108, 0.5);
        }

        /* Capa de Frases y Fotos Flotantes */
        #content-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: none;
        }

        .floating-card {
            position: absolute;
            background: rgba(20, 20, 30, 0.65);
            border: 1px solid rgba(255, 183, 3, 0.35);
            padding: 10px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            width: 190px;
            text-align: center;
            pointer-events: auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .floating-card:hover {
            transform: scale(1.06);
            box-shadow: 0 0 25px rgba(255, 183, 3, 0.5);
            border-color: #ffb703;
        }

        .floating-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .floating-card p {
            font-size: 0.78rem;
            color: #fff4bd;
            line-height: 1.3;
            text-shadow: 0 0 6px rgba(255, 183, 3, 0.4);
        }
    </style>
</head>
<body>

    <!-- Pantalla Inicial -->
    <div id="intro-screen">
        <div class="sunflower-container" id="sunflower-btn">
            <div class="sunflower">
                <div class="petals">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                </div>
                <div class="center-disc"></div>
            </div>
            <div class="instruction-card">
                <h2>Feliz Día de las Flores Amarillas 🌻</h2>
                <p>Presiona el girasol para comenzar</p>
            </div>
        </div>
    </div>

    <!-- Título Fijo Superior (Basado en el panel de DedicaCodes)[span_9](start_span)[span_9](end_span) -->
    <div id="top-title-banner">
        <h1>🌻 Feliz Día de las Flores Amarillas 🌻</h1>
    </div>

    <!-- Contenedor 3D de la Galaxia -->
    <div id="canvas-container"></div>

    <!-- Contenedor de Elementos Flotantes -->
    <div id="content-layer"></div>

    <!-- Audio de Coldplay - The Scientist -->
    <audio id="bg-audio" loop>
        <source src="https://cdns-preview-d.dzcdn.net/stream/c-deda738a163a8e9e76fa2e7d4bc9f1cb-3.mp3" type="audio/mp3">
        Tu navegador no soporta audio.
    </audio>

    <script>
        // Datos de frases y fotos tal cual los configuras en la plataforma
        const cardsData = [
            { text: "Como el girasol, miro hacia donde tú estás y encuentro mi luz.", img: "https://images.unsplash.com/photo-1597848212624-a19eb35e2651?auto=format&fit=crop&w=400&q=80" },
            { text: "Gracias por ser mi sol en los días más grises del año.", img: "https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=400&q=80" },
            { text: "Nadie dijo que fuera fácil, oh, llévame de regreso al principio... 🎶", img: "https://images.unsplash.com/photo-1508873696983-2df5f920cac9?auto=format&fit=crop&w=400&q=80" },
            { text: "Pétalos dorados solo para recordarte lo mucho que significas.", img: "https://images.unsplash.com/photo-1470240731273-7821a6eeb6bd?auto=format&fit=crop&w=400&q=80" }
        ];

        const sunflowerBtn = document.getElementById('sunflower-btn');
        const introScreen = document.getElementById('intro-screen');
        const canvasContainer = document.getElementById('canvas-container');
        const topTitleBanner = document.getElementById('top-title-banner');
        const contentLayer = document.getElementById('content-layer');
        const audio = document.getElementById('bg-audio');

        let galaxyStarted = false;

        sunflowerBtn.addEventListener('click', () => {
            if (galaxyStarted) return;
            galaxyStarted = true;

            // Reproducir The Scientist de Coldplay
            audio.volume = 0.6;
            audio.play().catch(e => console.log("Audio interactivo requerido:", e));

            // Transición de salida de la pantalla de girasol
            gsap.to(introScreen, {
                opacity: 0,
                duration: 1.5,
                onComplete: () => {
                    introScreen.style.display = 'none';
                    canvasContainer.style.opacity = 1;
                    topTitleBanner.style.display = 'block';
                    contentLayer.style.display = 'block';
                    initGalaxy();
                    createFloatingCards();
                }
            });
        });

        // Configuración de la Galaxia 3D con Three.js
        function initGalaxy() {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 35, 55);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            canvasContainer.appendChild(renderer.domElement);

            // Luz ambiental
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            // --- Agujero Negro y Anillo Dorado Brillante ---
            const blackHoleGeo = new THREE.SphereGeometry(3.8, 32, 32);
            const blackHoleMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const blackHole = new THREE.Mesh(blackHoleGeo, blackHoleMat);
            scene.add(blackHole);

            const ringGeo = new THREE.RingGeometry(4.5, 8.5, 64);
            const ringMat = new THREE.MeshBasicMaterial({ 
                color: 0xffb703, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.85
            });
            const goldRing = new THREE.Mesh(ringGeo, ringMat);
            goldRing.rotation.x = Math.PI / 2.3;
            scene.add(goldRing);

            // --- Partículas de la Galaxia en Espiral ---
            const particlesCount = 12000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particlesCount * 3);
            const colors = new Float32Array(particlesCount * 3);

            const colorInside = new THREE.Color('#ffea6c'); // Amarillo floral claro
            const colorOutside = new THREE.Color('#3a7bd5'); // Tinte espacial galáctico

            for (let i = 0; i < particlesCount; i++) {
                const i3 = i * 3;
                const radius = Math.random() * 40 + 4;
                const spinAngle = radius * 0.35;
                const branchAngle = ((i % 3) * Math.PI * 2) / 3;

                const rx = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 2.5;
                const ry = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 2.5;
                const rz = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 2.5;

                positions[i3] = Math.cos(branchAngle + spinAngle) * radius + rx;
                positions[i3 + 1] = ry;
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + rz;

                const mixedColor = colorInside.clone();
                mixedColor.lerp(colorOutside, radius / 45);

                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const particleMaterial = new THREE.PointsMaterial({
                size: 0.65,
                sizeAttenuation: true,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.8
            });

            const galaxyPoints = new THREE.Points(geometry, particleMaterial);
            scene.add(galaxyPoints);

            // Movimiento dinámico según la posición del cursor
            let mouseX = 0, mouseY = 0;
            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 0.4;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 0.4;
            });

            function animate() {
                requestAnimationFrame(animate);

                galaxyPoints.rotation.y += 0.0012;
                goldRing.rotation.z -= 0.0025;

                camera.position.x += (mouseX * 15 - camera.position.x) * 0.05;
                camera.position.y += (-mouseY * 15 - camera.position.y) * 0.05;
                camera.lookAt(scene.position);

                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // Crear tarjetas flotantes distribuidas armónicamente
        function createFloatingCards() {
            cardsData.forEach((data, index) => {
                const card = document.createElement('div');
                card.className = 'floating-card';

                // Distribuir en las esquinas y zonas laterales para no tapar el centro de la galaxia
                const coords = [
                    { left: '8%', top: '22%' },
                    { left: '76%', top: '20%' },
                    { left: '10%', top: '65%' },
                    { left: '74%', top: '63%' }
                ];

                card.style.left = coords[index % coords.length].left;
                card.style.top = coords[index % coords.length].top;

                card.innerHTML = `
                    <img src="${data.img}" alt="Foto flotante">
                    <p>${data.text}</p>
                `;

                // Animación flotante continua con GSAP
                gsap.to(card, {
                    y: "random(-12, 12)",
                    x: "random(-8, 8)",
                    rotation: "random(-2, 2)",
                    duration: "random(3.5, 5)",
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut"
                });

                contentLayer.appendChild(card);
            });
        }
    </script>
</body>
</html>

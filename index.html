<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida 💛</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Caveat', cursive, serif;
            overflow: hidden;
            color: #ffe135;
        }

        /* Pantalla de inicio */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 1.2s ease;
        }

        .center-flower {
            font-size: 5rem;
            animation: pulseFlower 1.5s infinite alternate;
            text-shadow: 0 0 20px #ffe135;
        }

        #welcome-screen h2 {
            font-size: 2rem;
            margin-top: 15px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 225, 53, 0.5);
        }

        /* Contenedor de la Galaxia */
        #galaxy-container {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sun-center {
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #221c00 0%, #000 70%);
            border-radius: 50%;
            box-shadow: 0 0 60px #ffe135, inset 0 0 30px #ffea75;
            z-index: 10;
        }

        /* Título superior */
        .top-title {
            position: absolute;
            top: 5%;
            width: 100%;
            text-align: center;
            font-size: 2.5rem;
            text-shadow: 0 0 15px #ffe135;
            z-index: 20;
        }

        /* Órbitas de frases y rosas flotantes */
        .orbit {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            animation: rotateGalaxy 25s linear infinite;
        }

        .item-floating {
            position: absolute;
            white-space: nowrap;
            font-size: 1.4rem;
            text-shadow: 0 0 8px rgba(255, 225, 53, 0.8);
        }

        @keyframes pulseFlower {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #ffe135); }
            100% { transform: scale(1.15); filter: drop-shadow(0 0 25px #ffe135); }
        }

        @keyframes rotateGalaxy {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Pantalla de inicio -->
    <div id="welcome-screen" onclick="initExperience()">
        <div class="center-flower">🌻</div>
        <h2>Toca para iniciar</h2>
    </div>

    <!-- Escenario de la Galaxia -->
    <div id="galaxy-container">
        <div class="top-title">Feliz Día de las Rosas Amarillas</div>
        <div class="sun-center"></div>

        <div class="orbit">
            <div class="item-floating" style="top: 0; left: 50%;">💛 Eres mi luz</div>
            <div class="item-floating" style="bottom: 0; left: 40%;">🌹 Te amo</div>
            <div class="item-floating" style="top: 30%; left: 0;">✨ Mi mitad</div>
            <div class="item-floating" style="top: 70%; right: 0;">🌻 Para ti con amor</div>
            <div class="item-floating" style="top: 15%; right: 10%;">💛 Siempre juntos</div>
        </div>
    </div>

    <!-- Audio de respaldo -->
    <audio id="background-music" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-tenderness.mp3" type="audio/mpeg">
    </audio>

    <script>
        function initExperience() {
            var welcome = document.getElementById('welcome-screen');
            var galaxy = document.getElementById('galaxy-container');
            var music = document.getElementById('background-music');

            music.play().catch(e => console.log("Audio bloqueado por navegador"));

            welcome.style.opacity = '0';
            setTimeout(function() {
                welcome.style.display = 'none';
                galaxy.style.opacity = '1';
            }, 1000);
        }
    </script>
</body>
</html>
